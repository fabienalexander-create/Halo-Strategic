<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:1200px;background:#101A30;overflow:hidden}
.card{width:1200px;height:1200px;background:#101A30;position:relative;padding:100px 90px 160px;display:flex;flex-direction:column;justify-content:center}
.bar{position:absolute;top:0;left:0;right:0;height:10px;background:#B08D57}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#101A30;background:#D8BE8F;padding:8px 18px;border-radius:20px;width:fit-content;margin-bottom:40px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:84px;line-height:1.1;color:#F6F6F3}
h1 span{color:#D8BE8F}
.sub{font-family:'Inter',sans-serif;font-size:28px;line-height:1.45;color:#F6F6F3;opacity:.85;max-width:900px;margin-top:40px}
.chips{display:flex;gap:14px;margin-top:40px;flex-wrap:wrap}
.chip{font-family:'Inter',sans-serif;font-weight:600;font-size:22px;color:#F6F6F3;border:1.5px solid #B08D57;border-radius:30px;padding:10px 22px}
.foot{position:absolute;bottom:60px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(246,246,243,.18);padding-top:22px}
.wm{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#F6F6F3}
.cta{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;color:#101A30;background:#D8BE8F;padding:12px 26px;border-radius:8px}
</style></head><body><div class="card"><div class="bar"></div>
<div class="eyebrow">Qualified appointments</div>
<h1>Skip the chasing.<br><span>Get qualified appointments.</span></h1>
<div class="sub">Ready-to-go meetings with people who've shown real intent, checked against criteria agreed upfront.</div>
<div class="chips"><div class="chip">Real intent</div><div class="chip">Agreed criteria</div><div class="chip">Ready to go</div></div>
<div class="foot"><div class="wm">Halo Strategic</div><div class="cta">Get a quote</div></div>
</div></body></html>
