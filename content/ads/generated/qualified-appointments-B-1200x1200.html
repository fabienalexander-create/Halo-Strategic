<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:1200px;background:#F6F6F3;overflow:hidden}
.card{width:1200px;height:1200px;background:#F6F6F3;position:relative;padding:110px 100px 170px 110px;display:flex;flex-direction:column;justify-content:center}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#B08D57}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:92px;line-height:1.08;color:#101A30}
h1 s{text-decoration-color:#B08D57;text-decoration-thickness:6px;color:#8a8f9c}
h1 span{color:#B08D57}
.sub{font-family:'Inter',sans-serif;font-size:28px;line-height:1.45;color:#101A30;opacity:.8;max-width:900px;margin-top:44px}
.steps{display:flex;gap:18px;margin-top:44px}
.step{flex:1;background:#101A30;border-radius:14px;padding:26px 24px;color:#F6F6F3}
.n{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.14em;color:#D8BE8F}
.t{font-family:'Inter',sans-serif;font-weight:600;font-size:24px;margin-top:8px}
.foot{position:absolute;left:110px;right:110px;bottom:70px;display:flex;justify-content:space-between;align-items:center}
.wm{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:#101A30}
.cta{font-family:'Inter',sans-serif;font-weight:700;font-size:18px;color:#F6F6F3;background:#101A30;padding:12px 26px;border-radius:8px}
</style></head><body><div class="card"><div class="bar"></div>
<h1><s>Enquiries.</s><br><span>Booked appointments.</span></h1>
<div class="sub">Tell us who you want to meet. We bring you qualified, ready-to-go appointments, checked against criteria we agree upfront.</div>
<div class="steps"><div class="step"><div class="n">01</div><div class="t">Agree the criteria</div></div><div class="step"><div class="n">02</div><div class="t">We qualify the intent</div></div><div class="step"><div class="n">03</div><div class="t">You take the meeting</div></div></div>
<div class="foot"><div class="wm">Halo Strategic</div><div class="cta">Get a quote</div></div>
</div></body></html>
