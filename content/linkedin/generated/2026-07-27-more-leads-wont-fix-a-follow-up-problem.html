<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:1200px; background:#101A30; overflow:hidden; }
  .card { width:1200px; height:1200px; background:#101A30; display:flex; flex-direction:column; justify-content:center; padding:100px 90px; position:relative; }
  .topbar { position:absolute; top:0; left:0; right:0; height:10px; background:#B08D57; }
  .eyebrow { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.18em; text-transform:uppercase; color:#101A30; background:#D8BE8F; display:inline-block; padding:8px 18px; border-radius:20px; margin-bottom:56px; width:fit-content; }
  h1 { font-family:'Fraunces', serif; font-weight:600; font-size:76px; line-height:1.12; color:#F6F6F3; margin-bottom:8px; }
  h1.accent { color:#D8BE8F; }
  .support { font-family:'Inter', sans-serif; font-size:26px; line-height:1.5; color:#F6F6F3; opacity:0.82; max-width:920px; margin-top:48px; }
  .footer { position:absolute; bottom:70px; left:90px; right:90px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(246,246,243,0.18); padding-top:28px; }
  .wordmark { font-family:'IBM Plex Mono', monospace; font-size:17px; letter-spacing:0.14em; text-transform:uppercase; color:#F6F6F3; }
  .domain { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:#B08D57; }
</style></head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <div class="eyebrow">Commercial Pattern</div>
    <h1>14 leads.</h1>
    <h1 class="accent">1 booked visit.</h1>
    <div class="support">Still think it's a lead problem?</div>
    <div class="footer">
      <div class="wordmark">HALO STRATEGIC</div>
      <div class="domain">halostrategic.com</div>
    </div>
  </div>
</body></html>
