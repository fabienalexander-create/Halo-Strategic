<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Sized by viewport, not fixed px, so the same markup renders correctly at both
     1200x1200 (square) and 1200x627 (wide) window sizes from render.js --wide.
     Width (1200 either way) drives font sizes via vw; height (1200 vs 627) drives
     vertical spacing via vh, so the layout compresses proportionally in wide mode
     instead of needing a second template. */
  html, body { width:100vw; height:100vh; background:#101A30; overflow:hidden; }
  .card { width:100vw; height:100vh; background:#101A30; display:flex; flex-direction:column; justify-content:center; padding:6vh 7.5vw; position:relative; }
  .topbar { position:absolute; top:0; left:0; right:0; height:0.8vh; background:#B08D57; }
  h1 { font-family:'Fraunces', serif; font-weight:600; font-size:6.4vw; line-height:1.14; color:#F6F6F3; max-width:88%; }
  h1.empty { display:none; }
  .support { font-family:'Inter', sans-serif; font-size:1.85vw; line-height:1.5; color:#F6F6F3; opacity:0.82; max-width:75%; margin-top:3.5vh; }
  .offer-row { display:flex; align-items:center; gap:1vw; margin-top:4.5vh; }
  .offer-rule { width:2.4vw; height:2px; background:#B08D57; }
  .offer { font-family:'IBM Plex Mono', monospace; font-size:1.15vw; letter-spacing:0.16em; text-transform:uppercase; color:#D8BE8F; }
  .footer { position:absolute; bottom:5.5vh; left:7.5vw; right:7.5vw; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(246,246,243,0.18); padding-top:2.2vh; }
  .lockup { height:3.4vh; width:auto; }
  .domain { font-family:'IBM Plex Mono', monospace; font-size:1vw; letter-spacing:0.1em; text-transform:uppercase; color:#B08D57; }
</style></head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <h1 class="{{HEADLINE1_EMPTY}}">{{HEADLINE1}}</h1>
    <h1 class="{{HEADLINE2_EMPTY}}">{{HEADLINE2}}</h1>
    <h1 class="{{HEADLINE3_EMPTY}}">{{HEADLINE3}}</h1>
    <div class="support">{{SUPPORT}}</div>
    <div class="offer-row">
      <div class="offer-rule"></div>
      <div class="offer">{{OFFER}}</div>
    </div>
    <div class="footer">
      <svg class="lockup" viewBox="0 0 330 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Halo Strategic">
        <g transform="translate(8,10) scale(0.85)">
          <path d="M 42 18 A 32 32 0 0 0 42 82" fill="none" stroke="#F6F6F3" stroke-width="7" stroke-linecap="round"/>
          <path d="M 58 18 A 32 32 0 0 1 58 82" fill="none" stroke="#F6F6F3" stroke-width="7" stroke-linecap="round"/>
          <path d="M 45.7 50 L 54.3 50 L 50 87.5 Z" fill="#D8BE8F"/>
        </g>
        <line x1="118" y1="14" x2="118" y2="106" stroke="#D8BE8F" stroke-width="1.5"/>
        <text x="140" y="62" font-family="Fraunces, 'Fraunces Variable', Georgia, serif" font-weight="600" font-size="46" letter-spacing="4" fill="#F6F6F3">HALO</text>
        <text x="141" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="19" letter-spacing="7" fill="#D8BE8F">STRATEGIC</text>
      </svg>
      <div class="domain">halostrategic.com</div>
    </div>
  </div>
</body></html>
