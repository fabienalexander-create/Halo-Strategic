<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:1200px; background:#101A30; overflow:hidden; }
  .card { width:1200px; height:1200px; background:#101A30; display:flex; flex-direction:column; justify-content:center; padding:100px 90px; position:relative; }
  .topbar { position:absolute; top:0; left:0; right:0; height:10px; background:#B08D57; }
  .slide-num { font-family:'IBM Plex Mono', monospace; font-size:16px; letter-spacing:0.14em; color:#8FA0BD; margin-bottom:44px; }
  h1 { font-family:'Fraunces', serif; font-weight:600; font-size:64px; line-height:1.2; color:#F6F6F3; margin-bottom:36px; max-width:980px; }
  .body-text { font-family:'Inter', sans-serif; font-size:28px; line-height:1.55; color:#F6F6F3; opacity:0.88; max-width:920px; }
  .dots { position:absolute; bottom:70px; left:90px; display:flex; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:rgba(216,190,143,0.3); }
  .dot.active { background:#D8BE8F; }
  .footer-right { position:absolute; bottom:70px; right:90px; display:flex; align-items:center; gap:16px; }
  .domain { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:#B08D57; }
</style></head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <div class="slide-num">{{SLIDE_NUM}} / {{SLIDE_TOTAL}}</div>
    <h1>{{HEADLINE}}</h1>
    <div class="body-text">{{BODY}}</div>
    <div class="dots">{{DOTS_HTML}}</div>
    <div class="footer-right"><div class="domain">halostrategic.com</div></div>
  </div>
</body></html>
