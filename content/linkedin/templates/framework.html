<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:1200px; background:#101A30; overflow:hidden; }
  .card { width:1200px; height:1200px; background:#101A30; display:flex; flex-direction:column; padding:90px; position:relative; }
  .topbar { position:absolute; top:0; left:0; right:0; height:10px; background:#B08D57; }
  .eyebrow { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.18em; text-transform:uppercase; color:#101A30; background:#D8BE8F; display:inline-block; padding:8px 18px; border-radius:20px; margin-bottom:36px; width:fit-content; }
  h1 { font-family:'Fraunces', serif; font-weight:600; font-size:52px; line-height:1.2; color:#F6F6F3; margin-bottom:52px; max-width:1000px; }
  .items { display:flex; flex-direction:column; gap:26px; flex:1; }
  .item { display:flex; align-items:flex-start; gap:26px; }
  .item.empty { display:none; }
  .num { font-family:'Fraunces', serif; font-weight:600; font-size:34px; color:#D8BE8F; width:60px; flex-shrink:0; }
  .item-text { font-family:'Inter', sans-serif; font-size:25px; line-height:1.45; color:#F6F6F3; opacity:0.92; padding-top:4px; }
  .item-text b { color:#F6F6F3; opacity:1; font-weight:600; }
  .footer { position:absolute; bottom:70px; left:90px; right:90px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(246,246,243,0.18); padding-top:28px; }
  .wordmark { font-family:'IBM Plex Mono', monospace; font-size:17px; letter-spacing:0.14em; text-transform:uppercase; color:#F6F6F3; }
  .domain { font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; color:#B08D57; }
</style></head>
<body>
  <div class="card">
    <div class="topbar"></div>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <div class="items">
      <div class="item {{ITEM1_EMPTY}}"><div class="num">01</div><div class="item-text">{{ITEM1}}</div></div>
      <div class="item {{ITEM2_EMPTY}}"><div class="num">02</div><div class="item-text">{{ITEM2}}</div></div>
      <div class="item {{ITEM3_EMPTY}}"><div class="num">03</div><div class="item-text">{{ITEM3}}</div></div>
      <div class="item {{ITEM4_EMPTY}}"><div class="num">04</div><div class="item-text">{{ITEM4}}</div></div>
      <div class="item {{ITEM5_EMPTY}}"><div class="num">05</div><div class="item-text">{{ITEM5}}</div></div>
      <div class="item {{ITEM6_EMPTY}}"><div class="num">06</div><div class="item-text">{{ITEM6}}</div></div>
    </div>
    <div class="footer">
      <div class="wordmark">HALO STRATEGIC</div>
      <div class="domain">halostrategic.com</div>
    </div>
  </div>
</body></html>
